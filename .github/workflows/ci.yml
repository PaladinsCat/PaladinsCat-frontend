name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency security regression tests
        timeout-minutes: 2
        run: node --test scripts/security-dependencies.test.mjs

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Operations security tests
        run: npm run test:operations

      - name: Anonymous presence privacy tests
        run: npm run test:anonymous-presence

      - name: Champion page request tests
        run: npm run test:champion-page

      - name: Build
        run: npm run build

      - name: Install Chromium for auth UI tests
        run: npx playwright install --with-deps chromium

      - name: Auth UI browser tests
        env:
          PALADINSCAT_WEBSITE_GATE_SECRET_FILE: ${{ runner.temp }}/auth-ui-gate-key
          PALADINSCAT_PUBLIC_ORIGIN: http://127.0.0.1:3100
        run: |
          # Exercise the production gate with a disposable test-only signing key.
          node -e "require('node:fs').writeFileSync(process.env.PALADINSCAT_WEBSITE_GATE_SECRET_FILE, require('node:crypto').randomBytes(32).toString('hex'), { mode: 0o600 })"
          trap 'rm -f -- "$PALADINSCAT_WEBSITE_GATE_SECRET_FILE"' EXIT
          npm run test:ui:auth
