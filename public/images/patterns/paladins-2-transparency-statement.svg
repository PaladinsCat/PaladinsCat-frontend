<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600">
  <defs>
    <pattern
      id="project-statement"
      width="768"
      height="56.568542"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(-45)"
      overflow="visible"
    >
      <text
        x="0"
        y="22"
        fill="#870000"
        fill-opacity=".7"
        font-family="Inter, Arial, sans-serif"
        font-size="22"
        font-weight="700"
      >&#160;PaladinsCat does not support Paladins 2 project for lack of transparency.</text>
    </pattern>
    <pattern
      id="trust-statement"
      width="510"
      height="56.568542"
      patternUnits="userSpaceOnUse"
      patternTransform="rotate(-45)"
      overflow="visible"
    >
      <text
        x="0"
        y="50.284271"
        fill="#870000"
        fill-opacity=".7"
        font-family="Inter, Arial, sans-serif"
        font-size="22"
        font-weight="700"
      >&#160;In statistics, once a trust is lost, it is lost forever.</text>
    </pattern>
  </defs>
  <rect width="1600" height="1600" fill="url(#project-statement)" />
  <rect width="1600" height="1600" fill="url(#trust-statement)" />
</svg>
